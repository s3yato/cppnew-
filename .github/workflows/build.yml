name: Build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: macos-14
            name: macos-arm64

          - os: macos-13
            name: macos-x64

          - os: ubuntu-24.04
            name: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Rename binary
        run: cp build/cppnew cppnew-${{ github.ref_name }}-${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cppnew-${{ github.ref_name }}-${{ matrix.name }}
          path: cppnew-${{ github.ref_name }}-${{ matrix.name }}